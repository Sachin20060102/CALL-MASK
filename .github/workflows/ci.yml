name: MocoCall CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  spec-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify zero user payment/wallet/billing implementation
        run: node scripts/verify-no-payment-spec.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Generate Prisma client & validate schema
        working-directory: backend
        env:
          DATABASE_URL: mysql://mococall_user:mococall_dev_password@localhost:3306/mococall
        run: npx prisma generate && npx prisma validate
      - name: Typecheck, test, and build backend
        working-directory: backend
        run: npm run typecheck && npm test && npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Typecheck, test, and build web
        working-directory: web
        run: npm run typecheck && npm test && npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and unit-test Android app
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
